name: Import Observatory IV package
on:
  push:
    branches: [add-observatory-iv]
    paths: [.github/workflows/import-observatory-iv.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: add-observatory-iv
      - name: Download the exact source delivery
        env:
          PACKAGE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-a588-81f5-ba3c-fc42a7b9fb97/raw?se=2026-09-21T02%3A41%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=a8ddc9f3-9586-59ee-90dc-a3f4e326fd41&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T06%3A17%3A06Z&ske=2026-09-21T06%3A17%3A06Z&sks=b&skv=2026-02-06&sig=NIETiv8zlBgyrf2d1ViI%2B20CNNzLMPD8gLjoy0fg0Ho%3D'
        run: |
          mkdir -p downloads
          curl --fail-with-body --location --max-time 120 --user-agent 'Mozilla/5.0' "$PACKAGE_URL" --output downloads/CYBR_Observatory_IV_Source.zip
      - name: Verify and extract the complete package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, stat, zipfile
          root = pathlib.Path.cwd()
          archive = root / 'downloads/CYBR_Observatory_IV_Source.zip'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != 'ebf85d46b54a510915cf48e15f14944cac33e81be3f7a9e9618f29a38f549a0a':
              raise RuntimeError('Source archive checksum mismatch')
          scene = root / 'scenes/observatory-iv'
          if scene.exists():
              raise RuntimeError('Refusing to replace an existing scene')
          scene.mkdir(parents=True)
          files = []
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise RuntimeError('Archive CRC verification failed')
              for entry in z.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if not path.parts or path.parts[0] != 'CYBR_Observatory_IV' or '..' in path.parts or path.is_absolute() or stat.S_ISLNK(entry.external_attr >> 16):
                      raise RuntimeError('Unsafe or unexpected archive path')
                  relative = pathlib.Path(*path.parts[1:])
                  dest = scene / relative
                  if not dest.resolve().is_relative_to(scene.resolve()):
                      raise RuntimeError('Unsafe extraction path')
                  if entry.is_dir():
                      dest.mkdir(parents=True, exist_ok=True)
                      continue
                  if dest.suffix.lower() in ('.ttf','.otf','.woff','.woff2'):
                      raise RuntimeError('Font binaries must not be published')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  data = z.read(entry)
                  dest.write_bytes(data)
                  if relative.name == 'render.sh':
                      dest.chmod(0o755)
                  files.append({'path':str(relative), 'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()})
          for required in ['src/observatory.cpp','build_scene.py','assets/observatory_interior_source.glb','renders/Observatory_IV.png','LICENSE']:
              if not (scene / required).is_file():
                  raise RuntimeError('Required scene file missing: ' + required)
          shutil.copy2(scene / 'LICENSE', root / 'LICENSE')
          (root / '.gitignore').write_text('__pycache__/\n*.py[cod]\n.venv/\nbuild/\nbuild_*/\nscenes/*/scene/*.cvr2\nscenes/*/scene/*.groups\nscenes/*/scene/*.glb\nscenes/*/scene/textures/\nscenes/*/renders/reproduction*\nscenes/*/renders/smoke*\n')
          docs = root / 'docs'
          docs.mkdir(exist_ok=True)
          (docs / 'observatory-iv-import.json').write_text(json.dumps({'source_archive_sha256':actual,'source_archive_bytes':archive.stat().st_size,'imported_files':files,'scope':'Exact source delivery imported. Generated transport meshes must be rebuilt before rendering. Production images and historical verification records are retained, not regenerated by this import.'},indent=2)+'\n')
          print('Imported',len(files),'verified files including binary geometry and images.')
          PY
      - name: Compile and test the imported native renderer
        run: |
          cmake -S scenes/observatory-iv -B scenes/observatory-iv/build -DCMAKE_BUILD_TYPE=Release
          cmake --build scenes/observatory-iv/build -j2
          ctest --test-dir scenes/observatory-iv/build --output-on-failure
          python3 -m compileall -q scenes/observatory-iv
      - name: Publish source and assets to the import branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE .gitignore scenes downloads docs
          git commit -m 'Add complete Observatory IV source, geometry, materials, renders, and verification records'
          git push origin HEAD:add-observatory-iv
