name: Afterlight Forest Build
on:
  push:
    branches: ['afterlight/forest-v3']
    paths: ['.github/workflows/afterlight-forest-build.yml', 'afterlight-forest/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire public CC-BY forest captures
        shell: bash
        run: |
          mkdir -p afterlight-capture/vendor afterlight-capture/source afterlight-forest/public/data
          cd afterlight-capture/vendor
          npm pack @sparkjsdev/spark@2.4.0 three@0.180.0
          cd ../..
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json, pathlib, zipfile, hashlib, concurrent.futures
          root=pathlib.Path('afterlight-capture/source')
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Afterlight-Forest/3.0'}),timeout=120).read()
          for sid,creator,title in [('259c0051','draftmode','Forest Scan'),('0c75de4a','alfred2010','Tree work along the nature trail')]:
              out=pathlib.Path('afterlight-forest/public/data')/sid
              out.mkdir(parents=True,exist_ok=True)
              page=get('https://superspl.at/scene/'+sid).decode()
              if 'CC BY 4.0' not in page: raise RuntimeError('Expected CC BY 4.0 license not on source page')
              text=get('https://superspl.at/s?id='+sid).decode()
              (root/(sid+'-viewer.html')).write_text(text)
              settings=json.loads(re.search(r'<script[^>]*id="sse-bootstrap"[^>]*>(.*?)</script>',text,re.S).group(1))
              safe={k:v for k,v in settings.items() if k!='telemetry'}
              (out/'capture.json').write_text(json.dumps(safe,indent=2))
              metaurl=settings['contentUrl']
              meta=json.loads(get(metaurl))
              print('META',sid,json.dumps(meta)[:10000])
              (out/'meta.json').write_text(json.dumps(meta))
              names=set()
              def visit(v):
                  if isinstance(v,dict):
                      for x in v.values():visit(x)
                  elif isinstance(v,list):
                      for x in v:visit(x)
                  elif isinstance(v,str) and re.search(r'\.(webp|bin|png)$',v):names.add(v)
              visit(meta)
              def download(name):
                  b=get(urllib.parse.urljoin(metaurl,name)); dest=out/name
                  dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(b)
                  return {'path':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: records=list(pool.map(download,sorted(names)))
              with zipfile.ZipFile(out/'scene.sog','w',zipfile.ZIP_STORED) as z:
                  z.write(out/'meta.json','meta.json')
                  for name in sorted(names):z.write(out/name,name)
              if settings.get('posterUrl'):
                  (out/'source-poster.webp').write_bytes(get(settings['posterUrl']))
              if settings.get('collisionUrl'):
                  try:
                      b=get(settings['collisionUrl']);(out/'collision.json').write_bytes(b); print('COLLISION',sid,b[:3000])
                      cm=json.loads(b); cn=set()
                      def cv(v):
                          if isinstance(v,dict):
                              for x in v.values():cv(x)
                          elif isinstance(v,list):
                              for x in v:cv(x)
                          elif isinstance(v,str) and re.search(r'\.(bin|gz|voxel)$',v):cn.add(v)
                      cv(cm)
                      for name in cn:
                          dst=out/pathlib.Path(name).name;dst.write_bytes(get(urllib.parse.urljoin(settings['collisionUrl'],name)))
                  except Exception as e: print('COLLISION UNAVAILABLE',repr(e))
              prov={'title':title,'creator':creator,'source':'https://superspl.at/scene/'+sid,'license':'CC-BY-4.0','license_url':'https://creativecommons.org/licenses/by/4.0/','changes':'Lossless repack of published SOG images into a ZIP container. Camera and mesh additions are application-level, not edits to capture.','files':records}
              (out/'provenance.json').write_text(json.dumps(prov,indent=2))
              print('CAPTURE COMPLETE',sid,(out/'scene.sog').stat().st_size)
              for name in names:(out/name).unlink()
          PY
      - name: Build and render when implementation is present
        if: ${{ hashFiles('afterlight-forest/package.json') != '' }}
        run: |
          cd afterlight-forest
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterlight-forest-v3
          path: |
            afterlight-capture/
            afterlight-forest/public/
            afterlight-forest/dist/
            afterlight-forest/renders/
            afterlight-forest/test-results/
          retention-days: 7
          compression-level: 3
