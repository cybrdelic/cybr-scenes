name: Afterlight Forest Build
on:
  push:
    branches: ['afterlight/forest-v3']
    paths: ['.github/workflows/afterlight-forest-build.yml', 'afterlight-forest/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire published CC-BY forest metadata and pinned runtime
        shell: bash
        run: |
          mkdir -p afterlight-capture/vendor afterlight-capture/source
          cd afterlight-capture/vendor
          npm pack @sparkjsdev/spark@2.4.0 three@0.180.0
          cd ../..
          python3 - <<'PY'
          import urllib.request, re, json, pathlib, html
          root=pathlib.Path('afterlight-capture/source')
          urls={'page':'https://superspl.at/scene/259c0051','viewer':'https://superspl.at/s?id=259c0051'}
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Afterlight-Forest-Research/3.0'})
              data=urllib.request.urlopen(req,timeout=60).read().decode('utf-8')
              (root/(key+'.html')).write_text(data)
              print('\nSOURCE',key,'bytes',len(data))
              for match in re.finditer(r'(?:https?:)?//[^\s<>"\x27]+|(?:src|href)=["\x27]([^"\x27]+)',data):
                  v=html.unescape(match.group(1) or match.group(0))
                  if any(s in v for s in ['.js','.json','.sog','.ply','s3','cloudfront','assets','data.','settings']): print('LINK',v[:1500])
              for word in ['assetUrl','asset_url','modelUrl','model_url','splatUrl','settings','meta.json','splatData','sog','dataUrl','data_url','download']:
                  at=data.find(word)
                  if at>=0: print('CONTEXT',word,data[max(0,at-250):at+1200])
          (root/'provenance.json').write_text(json.dumps({'title':'Forest Scan','creator':'draftmode','source':urls['page'],'license':'CC-BY-4.0','license_url':'https://creativecommons.org/licenses/by/4.0/','scene_id':'259c0051'},indent=2))
          PY
      - name: Build and render when implementation is present
        if: ${{ hashFiles('afterlight-forest/package.json') != '' }}
        run: |
          cd afterlight-forest
          npm install --no-audit --no-fund
          npm run build
          npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterlight-forest-v3
          path: |
            afterlight-capture/
            afterlight-forest/dist/
            afterlight-forest/renders/
            afterlight-forest/test-results/
          retention-days: 7
          compression-level: 3
