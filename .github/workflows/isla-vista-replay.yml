name: Isla Vista public replay contracts
on:
  push:
    paths: ['scenes/isla-vista/**', '.github/workflows/isla-vista-replay.yml']
  pull_request:
    paths: ['scenes/isla-vista/**', '.github/workflows/isla-vista-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-and-native-light:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scenes/isla-vista
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorded scene and separate renderer dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install './vendor/light-scene-compat[portable]'
      - name: Reject changed source features and unsafe downloads
        run: python -m unittest discover -s verification -p 'test_*.py' -v
      - name: Verify installed snapshot and native indexed-mesh replay
        run: |
          python verification/verify_light_snapshot.py
          python verification/test_scene_compat_snapshot.py
      - name: Fetch and validate current public source contract
        run: python public_inputs.py fetch
      - name: Verify installed dependency and scene imports
        run: |
          python replay.py verify
          python verification/audit_source_imports.py
      - name: Run the native horizontal-illuminant fixture
        run: python tools/run_lagoon_stage.py --log verification/ci-daylight.log --receipt verification/ci-daylight-guard.json --seconds 180 -- python replay.py daylight-fixture
