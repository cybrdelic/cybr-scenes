name: Quickstart
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OPENCV_IO_ENABLE_OPENEXR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scenes/observatory-iv/requirements-tested.txt
      - name: Install documented environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake
          python -m pip install -r requirements.txt
      - name: Check active Python syntax on each supported interpreter
        run: python -m compileall -q -x '/(provenance|execution-repair|evidence|build|archive)/' cybr_scenes.py tests environments scenes/observatory-iv
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s environments/tests -v
      - name: Run root workflow from a fresh checkout
        run: python cybr_scenes.py render observatory-iv --quality smoke
      - name: Require automatic output checks and clean tracked source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('outputs/observatory-iv/hero/receipt.json').read_text())
          assert receipt['passed'] and receipt['verification']['passed']
          assert receipt['verification']['render']['image_dimensions']==[64,48]
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickstart-python-${{ matrix.python }}
          path: |
            outputs/observatory-iv/
            scenes/observatory-iv/build/logs/
            scenes/observatory-iv/build/verification/
          if-no-files-found: error
