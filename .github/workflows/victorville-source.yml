name: Victorville source verification
on:
  push:
    paths: ['scenes/victorville-road/**', 'tests/test_victorville_source.py', '.github/workflows/victorville-source.yml']
  pull_request:
    paths: ['scenes/victorville-road/**', 'tests/test_victorville_source.py', '.github/workflows/victorville-source.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_victorville_source.py
