name: Temporary V15 pretrained human muscle controller evaluation
on:
  pull_request:
    paths: [".github/workflows/v15-myosuite-free-policy.yml"]
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU MyoSuite environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libgl1-mesa-dri libgl1 libegl1
          python -m pip install --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 --branch v3.0.0 https://github.com/MyoHub/myosuite.git upstream
          python -m pip install --quiet -e ./upstream
          python -m pip install --quiet tyro rsl-rl-lib imageio-ffmpeg
          python - <<'PY'
          import mujoco, torch, myosuite
          print("RUNTIME",mujoco.__version__,torch.__version__)
          PY
      - name: Run genuine pretrained muscle-driven walking policy on CPU
        shell: bash
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          mkdir -p output
          cd upstream
          python - <<'PY'
          import pathlib,re
          p=pathlib.Path('scripts/eval_mjlab_policy.py')
          s=p.read_text()
          pat=re.compile(r'(?m)^(?P<indent> +)self\._renderer\.update_scene\(')
          def repl(m):
              ind=m.group('indent')
              return (ind+"if self._cam.type == mujoco.mjtCamera.mjCAMERA_FREE:\n"+
                      ind+"    world_com = self._data.subtree_com[1]\n"+
                      ind+"    self._cam.lookat[:] = [float(world_com[0]), float(world_com[1]), float(world_com[2]) + 0.08]\n"+
                      ind+"self._renderer.update_scene(")
          s,n=pat.subn(repl,s)
          print("camera tracking substitutions",n,flush=True)
          assert n>0
          p.write_text(s)
          PY
          python scripts/eval_mjlab_policy.py myoLegWalk-v0 --backend cpu --episodes 1 --video ../output/MyoSuite_real_muscle_walking.mp4 --width 640 --height 480 --distance 2.8 --azimuth 130 --elevation -10 2>&1 | tee ../output/evaluation.log
          python - <<'PY'
          from myosuite.utils.checkpoint_utils import find_checkpoint
          from pathlib import Path
          from shutil import copy2
          import hashlib,json
          p=Path(find_checkpoint('myoLegWalk-v0'))
          target=Path('../output') / 'myoLegWalk_trained_model.pt'
          copy2(p,target)
          man=p.parent/'manifest.json'
          if man.exists():copy2(man,Path('../output')/'checkpoint_manifest.json')
          print('checkpoint_sha256',hashlib.sha256(target.read_bytes()).hexdigest())
          PY
          python scripts/eval_mjlab_policy.py myoLegWalk-v0 --backend cpu --episodes 5 --stochastic 2>&1 | tee ../output/stochastic_evaluation.log || true
          cd ..
          test -s output/MyoSuite_real_muscle_walking.mp4
          python - <<'PY'
          import imageio.v2 as iio
          frames=iio.mimread('output/MyoSuite_real_muscle_walking.mp4',memtest=False)
          print('RENDER frames',len(frames))
          assert len(frames)>20
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-tracked-trained-anatomical-muscle-policy
          path: output/
          if-no-files-found: warn
          retention-days: 1
