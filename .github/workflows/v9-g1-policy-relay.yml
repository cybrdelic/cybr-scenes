name: Temporary public Unitree G1 policy relay
on:
  pull_request:
    paths: [".github/workflows/v9-g1-policy-relay.yml"]
jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Retrieve official pretrained G1 model and model assets
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/unitreerobotics/unitree_rl_gym.git upstream
          cd upstream
          git sparse-checkout set deploy/pre_train/g1 deploy/deploy_mujoco resources/robots/g1_description LICENSE
          git rev-parse HEAD | tee PINNED_COMMIT.txt
          ls -lh deploy/pre_train/g1/motion.pt
          test "$(stat -c%s deploy/pre_train/g1/motion.pt)" -gt 20000
          cp LICENSE UNITREE_LICENSE.txt
          cd ..
          mkdir -p artifact
          cp -a upstream/deploy upstream/resources artifact/
          cp upstream/PINNED_COMMIT.txt upstream/UNITREE_LICENSE.txt artifact/
          du -sh artifact
      - uses: actions/upload-artifact@v4
        with:
          name: official-g1-trained-policy-assets
          path: artifact/
          retention-days: 1
