name: Recovered environment verification
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python cybr_scenes.py compile
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scene: [sandstone-passage, basalt-tide, fernwater, desert-hot-springs, obsidian-reach, drowned-geode]
    defaults:
      run:
        working-directory: environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python cybr_scenes.py render ${{ matrix.scene }} --width 480 --spp 24 --water-spp 48 --threads 2 --output demo-output
      - name: Save fresh proof without Actions artifact storage
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ -d demo-output ]; then
            find demo-output -type f \( -name '*.png' -o -name '*.json' -o -name '*.log' \) -exec git add -f {} +
          fi
          git add evidence/render-batch.json
          git diff --cached --quiet || git commit -m "Fresh ${{ matrix.scene }} proof for ${{ github.sha }}"
          git push origin HEAD:proof/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scene }}
