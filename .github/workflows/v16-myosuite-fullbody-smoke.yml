name: V16 full-body anatomical controller evaluation — free CPU
on:
  pull_request:
    paths: [".github/workflows/v16-myosuite-fullbody-smoke.yml"]
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU anatomy stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libegl1 ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "myosuite[musclemimic]==3.0.0" onnxruntime imageio imageio-ffmpeg tyro rsl-rl-lib
          python -c "import myosuite,mujoco;print('VERSIONS',mujoco.__version__)"
      - name: Inspect published full-body policy and compatible reference clips
        shell: bash
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
          MYOSUITE_MUSCLEMIMIC_MODELS_VERSION: '1.0.5'
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY' > result/inventory.log 2>&1
          from huggingface_hub import HfApi, hf_hub_download
          from myosuite.integrations.musclemimic.fullbody_model import compile_mimic_fullbody_mjmodel, default_mimic_fullbody_config
          import mujoco, pathlib
          model, *_=compile_mimic_fullbody_mjmodel(default_mimic_fullbody_config())
          print('FULL_BODY',model.nbody,model.njnt,model.nu,model.ntendon,flush=True)
          api=HfApi()
          for repo in ['myohub/myosuite-3-baselines','amathislab/mm-10m-2','amathislab/musclemimic-retargeted']:
              print('\nREPOSITORY',repo,flush=True)
              try:
                  files=api.list_repo_files(repo,repo_type='model' if 'retargeted' not in repo else 'dataset')
                  print('COUNT',len(files),flush=True)
                  for f in files:
                      if 'fullbody' in f.lower() or 'medium06' in f.lower() or f.endswith('.onnx') or f.endswith('onnx.data'):
                          print('FILE',f,flush=True)
              except Exception as ex:print('UNAVAILABLE',type(ex).__name__,str(ex)[:400],flush=True)
          PY
          cat result/inventory.log
      - name: Attempt genuine muscle-driven full-body rollout
        shell: bash
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
          HF_HUB_DISABLE_XET: "1"
        run: |
          python - <<'PY' > result/demo_cache.log 2>&1
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          from shutil import copyfile
          root=Path.home()/'.musclemimic/caches/AMASS/MyoFullBody/gmr'
          paths=['KIT/314/walking_medium09_poses.npz',
                 'Transitions_mocap/mazen_c3d/punchboxing_kick_poses.npz',
                 'Transitions_mocap/mazen_c3d/run_longjump_poses.npz']
          for path in paths:
              src=hf_hub_download(repo_id='amathislab/musclemimic-retargeted',repo_type='dataset',filename='MyoFullBody/gmr/'+path)
              dst=root/path
              dst.parent.mkdir(parents=True,exist_ok=True)
              copyfile(src,dst)
              print('CACHED',dst,dst.stat().st_size,flush=True)
          import orbax.checkpoint
          print('ORBAX_AVAILABLE',flush=True)
          PY
          python - <<'PY' > result/fullbody_attempt.log 2>&1
          import subprocess
          from pathlib import Path
          cases=[
            ('walk','KIT/314/walking_medium09_poses',360),
            ('boxing_kick','Transitions_mocap/mazen_c3d/punchboxing_kick_poses',360),
            ('run_longjump','Transitions_mocap/mazen_c3d/run_longjump_poses',360),
          ]
          for label,motion,nsteps in cases:
              video=f'result/fullbody_{label}_policy.mp4'
              cmd=['myosuite-musclemimic-fullbody-eval','--path','hf://amathislab/mm-10m-2',
                   '--motion_path',motion,'--use_mujoco','--record','--record_path',video,
                   '--n_steps',str(nsteps),'--record_fps','24','--no_show_targets']
              print('COMMAND',cmd,flush=True)
              try:
                  p=subprocess.run(cmd,timeout=180,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  output=p.stdout
                  print(output[-12000:],flush=True)
                  print('RETURN_CODE',label,p.returncode,flush=True)
                  actual=('Using local policy runner' in output or 'Using ONNX policy runner' in output)
                  replay=('Checkpoint inference is not wired' in output or 'Falling back to trajectory replay' in output)
                  print('GENUINE_POLICY',label,actual and not replay,flush=True)
                  if not (p.returncode==0 and actual and not replay and Path(video).exists()):
                      Path(video).unlink(missing_ok=True)
              except Exception as exc:
                  print('ERROR',label,type(exc).__name__,str(exc),flush=True)
          PY
          cat result/fullbody_attempt.log
          for f in result/fullbody_*_policy.mp4; do
            test -s "$f" && ffprobe -hide_banner -loglevel error -show_entries format=duration -of default=nw=1 "$f" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v16-fullbody-verified-results
          path: result/
          retention-days: 1
