name: Create Amber Passage postcard
on: workflow_dispatch
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python tools/create_postcard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amber-passage
          path: |
            environments/demo-output/**/*.png
            environments/demo-output/**/*.json
            environments/demo-output/**/*.log
